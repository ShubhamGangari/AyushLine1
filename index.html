<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Favicon ──────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ─── Primary SEO ─────────────────────────────────────────────────── -->
    <title>Ayushline® — Holistic Health, Holistic Life | AYUSH Platform</title>
    <meta name="description" content="Ayushline is India's unified AYUSH platform for Ayurveda, Yoga, Unani, Siddha & Homeopathy — connecting practitioners, students and wellness seekers globally." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1B3A4B" />
    <link rel="canonical" href="https://ayushline.com" />

    <!-- ─── Open Graph (Facebook / LinkedIn / WhatsApp) ─────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Ayushline" />
    <meta property="og:title"       content="Ayushline® — Holistic Health, Holistic Life" />
    <meta property="og:description" content="India's unified AYUSH platform for Ayurveda, Yoga, Unani, Siddha & Homeopathy — connecting practitioners, students and wellness seekers globally." />
    <meta property="og:url"         content="https://ayushline.com" />
    <meta property="og:image"       content="https://ayushline.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ─── Twitter Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@ayushline" />
    <meta name="twitter:title"       content="Ayushline® — Holistic Health, Holistic Life" />
    <meta name="twitter:description" content="India's unified AYUSH platform — Ayurveda, Yoga, Unani, Siddha & Homeopathy." />
    <meta name="twitter:image"       content="https://ayushline.com/og-image.png" />

    <!-- ─── DNS Prefetch & Preconnect (performance) ──────────────────────── -->
    <link rel="dns-prefetch"    href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch"    href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch"    href="https://prxfgcvcbayezzjwyadv.supabase.co" />
    <link rel="dns-prefetch"    href="https://clerk.ayushline.com" />
    <link rel="preconnect"      href="https://fonts.googleapis.com" />
    <link rel="preconnect"      href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect"      href="https://images.unsplash.com" />

    <!-- ─── Google Fonts (display=swap for non-blocking render) ──────────── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- ─── JSON-LD Structured Data (Organization) ───────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Ayushline",
      "url": "https://ayushline.com",
      "logo": "https://ayushline.com/favicon.svg",
      "description": "India's unified AYUSH platform for Ayurveda, Yoga & Naturopathy, Unani, Siddha and Homeopathy — connecting practitioners, students and wellness seekers globally.",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": ["English", "Hindi"]
      },
      "areaServed": "IN",
      "foundingDate": "2024"
    }
    </script>

    <!-- ─── JSON-LD Structured Data (WebSite with SearchAction) ─────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ayushline",
      "url": "https://ayushline.com",
      "description": "AYUSH health platform for practitioners, students and wellness seekers.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://ayushline.com/consult?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="clerk-captcha"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
